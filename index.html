<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Ring</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #111111;
      --white: #f7f7f3;
      --red: #d62839;

      --sea-1: #a8e6d4;
      --sea-2: #8edbd5;
      --sea-3: #82cfe0;
      --sea-4: #91c9e8;
      --sea-5: #a8c8e8;
      --sea-6: #9dd9dc;
      --sea-7: #8dd8c9;
      --sea-8: #b1e2d3;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--white);
      color: var(--black);

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      padding: 30px 20px 50px;
    }

    /* ---------------- HEADER ---------------- */

    header {
      width: 100%;
      max-width: 1000px;

      border-bottom: 2px solid var(--black);

      padding-bottom: 12px;
    }

    .header-text {
      width: 100%;

      font-size: clamp(8px, 1.55vw, 15px);
      font-weight: 600;

      letter-spacing: -0.15px;

      line-height: 1;

      white-space: nowrap;

      text-align: justify;
      text-align-last: justify;
    }

    /* ---------------- WHEEL ---------------- */

    .wheel-container {
      position: relative;

      width: min(78vw, 470px);
      height: min(78vw, 470px);

      margin: 55px 0 35px;
    }

    /*
      The old gray outer ring has been removed.

      Instead, these layered red shadows create a
      subtle "disintegrating" effect where the red
      border gradually disappears into the page.
    */

    .wheel-container::before {
      content: "";

      position: absolute;

      inset: -2px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          transparent 69%,
          rgba(214, 40, 57, 0.20) 70%,
          rgba(214, 40, 57, 0.10) 72%,
          rgba(214, 40, 57, 0.035) 75%,
          transparent 79%
        );

      filter: blur(2px);

      pointer-events: none;
    }

    .wheel-container::after {
      content: "";

      position: absolute;

      inset: -8px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          transparent 70%,
          rgba(214, 40, 57, 0.08) 72%,
          rgba(214, 40, 57, 0.025) 76%,
          transparent 82%
        );

      filter: blur(4px);

      pointer-events: none;
    }

    .wheel {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      border: 3px solid var(--red);

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        conic-gradient(
          var(--sea-1),
          var(--sea-2),
          var(--sea-3),
          var(--sea-4),
          var(--sea-5),
          var(--sea-6),
          var(--sea-7),
          var(--sea-8),
          var(--sea-1)
        );

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.16);

      transition:
        transform 4s cubic-bezier(.12, .72, .12, 1);
    }

    .wheel::before {
      content: "";

      position: absolute;

      width: 70%;
      height: 32%;

      top: 7%;
      left: 15%;

      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.5),
          rgba(255, 255, 255, 0)
        );

      transform: rotate(-18deg);

      pointer-events: none;
    }

    .wheel-center {
      position: relative;
      z-index: 2;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      background: var(--black);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;

      border: 4px solid white;

      box-shadow:
        0 0 0 3px var(--black),
        0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* ---------------- POINTER ---------------- */

    .pointer {
      position: absolute;

      z-index: 10;

      top: -24px;
      left: 50%;

      transform: translateX(-50%);

      color: var(--red);

      font-size: 38px;

      line-height: 1;
    }

    /* ---------------- BUTTON ---------------- */

    #spinButton {
      border: 2px solid var(--black);

      background: var(--black);
      color: white;

      padding: 17px 65px;

      border-radius: 0;

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 2px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    #spinButton:hover {
      background: var(--red);

      border-color: var(--red);

      transform: translateY(-2px);
    }

    #spinButton:active {
      transform: translateY(1px);
    }

    #spinButton:disabled {
      opacity: 0.35;

      cursor: not-allowed;

      transform: none;
    }

    /* ---------------- REMAINING ---------------- */

    .remaining {
      margin-top: 20px;

      font-size: 12px;

      font-weight: 600;

      font-style: italic;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #555;
    }

    /* ---------------- RESULT ---------------- */

    .result {
      width: min(800px, 100%);

      margin-top: 55px;

      padding: 30px 20px;

      border-top: 2px solid var(--black);
      border-bottom: 2px solid var(--black);

      animation:
        reveal 0.6s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      margin-bottom: 12px;

      color: var(--red);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    #movieTitle {
      margin: 0;

      font-size: clamp(36px, 7vw, 70px);

      line-height: 0.95;

      font-weight: 700;

      letter-spacing: -3px;
    }

    #movieYear {
      margin: 15px 0 0;

      font-size: 15px;

      color: #555;

      font-weight: 400;
    }

    .hidden {
      display: none;
    }

    /* ---------------- MESSAGE ---------------- */

    #message {
      margin-top: 20px;

      max-width: 600px;

      color: var(--red);

      font-size: 12px;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 600px) {

      .app {
        padding-top: 20px;
      }

      header {
        padding-bottom: 10px;
      }

      .header-text {
        font-size: 7.5px;
        letter-spacing: -0.3px;
      }

      .wheel-container {
        width: 82vw;
        height: 82vw;

        margin-top: 48px;
      }

      .wheel {
        border-width: 3px;
      }

      .wheel-center {
        width: 82px;
        height: 82px;

        font-size: 29px;
      }

      .pointer {
        font-size: 32px;
        top: -21px;
      }

      #spinButton {
        width: min(80vw, 330px);

        padding: 16px 30px;
      }

      .result {
        margin-top: 45px;
      }

      #movieTitle {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>

      <div class="header-text">
        i hate movies more than i hate the second thing on the list of the things i hate
      </div>

    </header>


    <div class="wheel-container">

      <div class="pointer">
        ▼
      </div>

      <div id="wheel" class="wheel">

        <div class="wheel-center">
          🎬
        </div>

      </div>

    </div>


    <button id="spinButton">
      SPIN
    </button>


    <div id="remaining" class="remaining">
      Loading movies...
    </div>


    <div id="result" class="result hidden">

      <div class="result-label">
        Your Film
      </div>

      <h2 id="movieTitle"></h2>

      <p id="movieYear"></p>

    </div>


    <div id="message"></div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://kjyqhalcyrcklhgkqqtd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ETChgCgyYIhfVkaOY6zrSw_Hx1s2ixW";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const wheel =
      document.getElementById("wheel");

    const spinButton =
      document.getElementById("spinButton");

    const remaining =
      document.getElementById("remaining");

    const result =
      document.getElementById("result");

    const movieTitle =
      document.getElementById("movieTitle");

    const movieYear =
      document.getElementById("movieYear");

    const message =
      document.getElementById("message");


    let movies = [];

    let rotation = 0;


    /* ---------------- WHEEL GENERATOR ---------------- */

    function updateWheel() {

      const count = movies.length;

      if (count === 0) {

        wheel.style.background =
          "var(--sea-1)";

        return;
      }


      const colors = [
        "#a8e6d4",
        "#8edbd5",
        "#82cfe0",
        "#91c9e8",
        "#a8c8e8",
        "#9dd9dc",
        "#8dd8c9",
        "#b1e2d3"
      ];


      const segmentSize =
        360 / count;


      const stops = [];


      for (let i = 0; i < count; i++) {

        const start =
          i * segmentSize;

        const end =
          (i + 1) * segmentSize;


        const color =
          colors[i % colors.length];


        stops.push(
          `${color} ${start}deg ${end}deg`
        );

      }


      wheel.style.background =
        `conic-gradient(${stops.join(",")})`;

    }


    /* ---------------- LOAD MOVIES ---------------- */

    async function loadMovies() {

      remaining.textContent =
        "Loading movies...";


      const { data, error } =
        await client
          .from("Movies")
          .select("id, title, year")
          .eq("chosen", false);


      if (error) {

        console.error(
          "Supabase error:",
          error
        );

        remaining.textContent = "";

        message.textContent =
          "Supabase error: " +
          error.message;

        spinButton.disabled = true;

        return;
      }


      movies = data || [];


      updateWheel();

      updateRemaining();

    }


    /* ---------------- UPDATE COUNTER ---------------- */

    function updateRemaining() {

      remaining.textContent =
        `${movies.length} movie${movies.length === 1 ? "" : "s"} remaining`;

      spinButton.disabled =
        movies.length === 0;

    }


    /* ---------------- SPIN ---------------- */

    spinButton.addEventListener(
      "click",
      async () => {

        if (movies.length === 0) {
          return;
        }


        spinButton.disabled = true;

        message.textContent = "";

        result.classList.add("hidden");


        const randomIndex =
          Math.floor(
            Math.random() * movies.length
          );


        const movie =
          movies[randomIndex];


        rotation +=
          1800 +
          Math.floor(
            Math.random() * 720
          );


        wheel.style.transform =
          `rotate(${rotation}deg)`;


        setTimeout(
          async () => {

            movieTitle.textContent =
              movie.title;


            movieYear.textContent =
              movie.year || "";


            result.classList.remove(
              "hidden"
            );


            const { error } =
              await client
                .from("Movies")
                .update({
                  chosen: true,
                  chosen_at:
                    new Date().toISOString()
                })
                .eq("id", movie.id);


            if (error) {

              console.error(
                "Update error:",
                error
              );


              message.textContent =
                "The movie was selected, but it could not be marked as chosen.";


              spinButton.disabled =
                false;


              return;

            }


            movies =
              movies.filter(
                m => m.id !== movie.id
              );


            updateWheel();

            updateRemaining();

          },
          4000
        );

      }
    );


    /* ---------------- START ---------------- */

    loadMovies();

  </script>

</body>
</html>
