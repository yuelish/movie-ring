<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Ring</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #111111;
      --white: #f7f7f3;
      --red: #d62839;

      --sea-1: #a8e6d4;
      --sea-2: #8edbd5;
      --sea-3: #82cfe0;
      --sea-4: #91c9e8;
      --sea-5: #a8c8e8;
      --sea-6: #9dd9dc;
      --sea-7: #8dd8c9;
      --sea-8: #b1e2d3;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--white);
      color: var(--black);

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      padding: 30px 20px 50px;
    }

    /* ---------------- HEADER ---------------- */

    header {
      width: 100%;
      max-width: 1000px;

      border-bottom: 2px solid var(--black);

      padding-bottom: 12px;

      overflow: hidden;
    }

    .header-text {
      width: 100%;

      font-size: clamp(8px, 1.55vw, 15px);
      font-weight: 600;

      letter-spacing: -0.15px;

      line-height: 1;

      white-space: nowrap;

      text-align: justify;
      text-align-last: justify;

      transition:
        transform 0.5s ease,
        opacity 0.5s ease;
    }

    /*
      Original header leaves toward the left.
    */

    .header-text.slide-out {
      transform: translateX(-100%);
      opacity: 0;
    }

    /*
      Selected film enters from the right.
    */

    .header-text.slide-in {
      animation:
        headerSlideIn 0.5s ease forwards;
    }

    @keyframes headerSlideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* ---------------- WHEEL ---------------- */

    .wheel-container {
      position: relative;

      width: min(78vw, 470px);
      height: min(78vw, 470px);

      margin: 55px 0 35px;
    }

    .wheel-container::before {
      content: "";

      position: absolute;

      inset: -3px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          transparent 68%,
          rgba(214, 40, 57, 0.28) 69%,
          rgba(214, 40, 57, 0.18) 71%,
          rgba(214, 40, 57, 0.07) 74%,
          rgba(214, 40, 57, 0.02) 78%,
          transparent 83%
        );

      filter: blur(1.5px);

      pointer-events: none;
    }

    .wheel-container::after {
      content: "";

      position: absolute;

      inset: -11px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          transparent 69%,
          rgba(214, 40, 57, 0.12) 71%,
          rgba(214, 40, 57, 0.06) 74%,
          rgba(214, 40, 57, 0.018) 79%,
          transparent 85%
        );

      filter: blur(3px);

      pointer-events: none;
    }

    .wheel {
      position: relative;

      z-index: 2;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      border: 3px solid var(--red);

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        conic-gradient(
          var(--sea-1),
          var(--sea-2),
          var(--sea-3),
          var(--sea-4),
          var(--sea-5),
          var(--sea-6),
          var(--sea-7),
          var(--sea-8),
          var(--sea-1)
        );

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.16);

      transition:
        transform 4s cubic-bezier(.12, .72, .12, 1);
    }

    .wheel::before {
      content: "";

      position: absolute;

      width: 70%;
      height: 32%;

      top: 7%;
      left: 15%;

      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.5),
          rgba(255, 255, 255, 0)
        );

      transform: rotate(-18deg);

      pointer-events: none;
    }

    /* ---------------- CENTER ---------------- */

    .wheel-center {
      position: relative;

      z-index: 2;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      background: var(--white);

      color: var(--black);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;

      border: 4px solid var(--red);

      box-shadow:
        inset 0 4px 8px rgba(214, 40, 57, 0.28),
        inset 0 -2px 5px rgba(214, 40, 57, 0.12);

      cursor: pointer;

      transition:
        transform 0.15s ease;
    }

    .wheel-center:hover {
      transform: scale(1.06);
    }

    /* ---------------- POINTER ---------------- */

    .pointer {
      position: absolute;

      z-index: 10;

      top: -24px;
      left: 50%;

      transform: translateX(-50%);

      color: var(--red);

      font-size: 38px;

      line-height: 1;
    }

    /* ---------------- BUTTON ---------------- */

    #spinButton {
      border: 2px solid var(--black);

      background: var(--black);
      color: white;

      padding: 17px 65px;

      border-radius: 0;

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 2px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    #spinButton:hover {
      background: var(--red);

      border-color: var(--red);

      transform: translateY(-2px);
    }

    #spinButton:active {
      transform: translateY(1px);
    }

    #spinButton:disabled {
      opacity: 0.35;

      cursor: not-allowed;

      transform: none;
    }

    /* ---------------- REMAINING ---------------- */

    .remaining {
      margin-top: 20px;

      font-size: 12px;

      font-weight: 600;

      font-style: italic;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #555;
    }

    /* ---------------- HISTORY ---------------- */

    #history {
      width: min(800px, 100%);

      margin-top: 40px;

      padding-top: 25px;

      border-top: 2px solid var(--black);

      animation:
        reveal 0.4s ease both;
    }

    .history-label {
      color: var(--red);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 20px;
    }

    #historyList {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    #historyList li {
      padding: 10px 0;

      border-bottom: 1px solid #d5d5d0;

      font-size: 16px;

      color: var(--black);
    }

    #historyList li:last-child {
      border-bottom: none;
    }

    /* ---------------- MESSAGE ---------------- */

    #message {
      margin-top: 20px;

      max-width: 600px;

      color: var(--red);

      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 600px) {

      .app {
        padding-top: 20px;
      }

      header {
        padding-bottom: 10px;
      }

      .header-text {
        font-size: 7.5px;
        letter-spacing: -0.3px;
      }

      .wheel-container {
        width: 82vw;
        height: 82vw;

        margin-top: 48px;
      }

      .wheel {
        border-width: 3px;
      }

      .wheel-center {
        width: 82px;
        height: 82px;

        font-size: 29px;
      }

      .pointer {
        font-size: 32px;
        top: -21px;
      }

      #spinButton {
        width: min(80vw, 330px);

        padding: 16px 30px;
      }

      .wheel-container::before {
        inset: -2px;
      }

      .wheel-container::after {
        inset: -8px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>

      <div
        id="headerText"
        class="header-text"
      >
        i hate movies more than i hate the second thing on the list of the things i hate
      </div>

    </header>


    <div class="wheel-container">

      <div class="pointer">
        ▼
      </div>

      <div id="wheel" class="wheel">

        <button
          id="historyButton"
          class="wheel-center"
          type="button"
          aria-label="View previously chosen films"
        >
          🌐
        </button>

      </div>

    </div>


    <button id="spinButton">
      SPIN
    </button>


    <div id="remaining" class="remaining">
      Loading movies...
    </div>


    <div id="history" class="hidden">

      <div class="history-label">
        Previously Chosen
      </div>

      <ul id="historyList"></ul>

    </div>


    <div id="message"></div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://kjyqhalcyrcklhgkqqtd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ETChgCgyYIhfVkaOY6zrSw_Hx1s2ixW";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const wheel =
      document.getElementById("wheel");

    const historyButton =
      document.getElementById("historyButton");

    const history =
      document.getElementById("history");

    const historyList =
      document.getElementById("historyList");

    const spinButton =
      document.getElementById("spinButton");

    const remaining =
      document.getElementById("remaining");

    const headerText =
      document.getElementById("headerText");

    const message =
      document.getElementById("message");


    let movies = [];

    let rotation = 0;


    /* ---------------- WHEEL GENERATOR ---------------- */

    function updateWheel() {

      const count = movies.length;

      if (count === 0) {

        wheel.style.background =
          "var(--sea-1)";

        return;
      }


      const colors = [
        "#a8e6d4",
        "#8edbd5",
        "#82cfe0",
        "#91c9e8",
        "#a8c8e8",
        "#9dd9dc",
        "#8dd8c9",
        "#b1e2d3"
      ];


      const segmentSize =
        360 / count;

      const stops = [];


      for (let i = 0; i < count; i++) {

        const start =
          i * segmentSize;

        const end =
          (i + 1) * segmentSize;

        const color =
          colors[i % colors.length];


        stops.push(
          `${color} ${start}deg ${end}deg`
        );

      }


      wheel.style.background =
        `conic-gradient(${stops.join(",")})`;

    }


    /* ---------------- LOAD MOVIES ---------------- */

    async function loadMovies() {

      remaining.textContent =
        "Loading movies...";


      const { data, error } =
        await client
          .from("Movies")
          .select("id, title, year")
          .eq("chosen", false);


      if (error) {

        console.error(
          "Supabase error:",
          error
        );

        remaining.textContent = "";

        message.textContent =
          "Supabase error: " +
          error.message;

        spinButton.disabled = true;

        return;
      }


      movies = data || [];


      updateWheel();
      updateRemaining();

    }


    /* ---------------- UPDATE COUNTER ---------------- */

    function updateRemaining() {

      remaining.textContent =
        `${movies.length} movie${movies.length === 1 ? "" : "s"} remaining`;

      spinButton.disabled =
        movies.length === 0;

    }


    /* ---------------- LOAD HISTORY ---------------- */

    async function loadHistory() {

      historyList.innerHTML =
        "<li>Loading...</li>";


      const { data, error } =
        await client
          .from("Movies")
          .select("title")
          .eq("chosen", true)
          .order("chosen_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "History error:",
          error
        );

        historyList.innerHTML =
          "<li>Unable to load previously chosen films.</li>";

        return;
      }


      historyList.innerHTML = "";


      if (!data || data.length === 0) {

        historyList.innerHTML =
          "<li>No films have been chosen yet.</li>";

        return;
      }


      data.forEach(movie => {

        const li =
          document.createElement("li");

        li.textContent =
          movie.title;

        historyList.appendChild(li);

      });

    }


    /* ---------------- HISTORY BUTTON ---------------- */

    historyButton.addEventListener(
      "click",
      async () => {

        const isHidden =
          history.classList.contains("hidden");


        if (isHidden) {

          history.classList.remove("hidden");

          await loadHistory();

          history.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        } else {

          history.classList.add("hidden");

        }

      }
    );


    /* ---------------- SPIN ---------------- */

    spinButton.addEventListener(
      "click",
      async () => {

        if (movies.length === 0) {
          return;
        }


        spinButton.disabled = true;

        message.textContent = "";


        const randomIndex =
          Math.floor(
            Math.random() * movies.length
          );


        const movie =
          movies[randomIndex];


        rotation +=
          1800 +
          Math.floor(
            Math.random() * 720
          );


        wheel.style.transform =
          `rotate(${rotation}deg)`;


        setTimeout(
          async () => {

            /*
              Slide the ORIGINAL header
              out toward the left.
            */

            headerText.classList.remove(
              "slide-in"
            );

            headerText.classList.add(
              "slide-out"
            );


            /*
              After the original text
              has left, replace it with
              the chosen film.
            */

            setTimeout(
              () => {

                const year =
                  movie.year
                    ? ` — ${movie.year}`
                    : "";


                headerText.textContent =
                  `${movie.title}${year}`;


                headerText.classList.remove(
                  "slide-out"
                );


                void headerText.offsetWidth;


                /*
                  Film title enters from
                  the right.
                */

                headerText.classList.add(
                  "slide-in"
                );

              },
              500
            );


            /*
              Mark the movie as chosen
              in Supabase.
            */

            const { error } =
              await client
                .from("Movies")
                .update({
                  chosen: true,
                  chosen_at:
                    new Date().toISOString()
                })
                .eq("id", movie.id);


            if (error) {

              console.error(
                "Update error:",
                error
              );


              message.textContent =
                "The movie was selected, but it could not be marked as chosen.";


              spinButton.disabled =
                false;

              return;
            }


            movies =
              movies.filter(
                m => m.id !== movie.id
              );


            updateWheel();

            updateRemaining();

          },
          4000
        );

      }
    );


    /* ---------------- START ---------------- */

    loadMovies();

  </script>

</body>
</html>
