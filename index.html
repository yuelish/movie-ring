<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Ring</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --black: #090909;
      --ivory: #f1eee5;
      --muted: #aaa69c;
      --burgundy: #741f2b;
      --burgundy-bright: #a83245;
      --silver: #d9d9d9;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 25%,
          #292929 0%,
          #151515 30%,
          #090909 70%,
          #020202 100%
        );
      color: var(--ivory);
      font-family: "DM Mono", monospace;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.045;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,0.35) 3px
      );
      z-index: 100;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        inset 0 0 100px rgba(255,255,255,0.025),
        inset 0 0 250px rgba(116,31,43,0.08);
      z-index: 99;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px 60px;
    }

    /* HEADER */

    .header {
      width: min(900px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.16);
    }

    .catalog-number {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      text-align: left;
    }

    .brand {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--ivory);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 1.5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #67d27d;
      box-shadow: 0 0 8px #67d27d;
    }

    h1 {
      margin: 38px 0 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(46px, 9vw, 82px);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -3px;
      color: var(--ivory);
      text-shadow: 0 2px 15px rgba(0,0,0,0.7);
    }

    .subtitle {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* WHEEL */

    .wheel-container {
      position: relative;
      width: min(76vw, 430px);
      height: min(76vw, 430px);
      margin: 48px 0 32px;
    }

    .wheel-container::before {
      content: "";
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 50px rgba(116,31,43,0.2),
        inset 0 0 25px rgba(255,255,255,0.03);
    }

    .wheel-container::after {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1px solid rgba(217,217,217,0.15);
      pointer-events: none;
    }

    .pointer {
      position: absolute;
      z-index: 10;
      top: -31px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--ivory);
      font-size: 27px;
      filter: drop-shadow(0 0 7px rgba(255,255,255,0.5));
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #bcbcbc;

      background:
        conic-gradient(
          #761e2b 0deg 45deg,
          #111827 45deg 90deg,
          #31526d 90deg 135deg,
          #b69d69 135deg 180deg,
          #273f3d 180deg 225deg,
          #151f25 225deg 270deg,
          #9b6040 270deg 315deg,
          #514266 315deg 360deg
        );

      box-shadow:
        0 0 0 3px #222,
        0 0 0 5px #8d8d8d,
        0 0 45px rgba(0,0,0,0.9),
        inset 0 0 45px rgba(0,0,0,0.65);

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform 4s cubic-bezier(.12,.72,.12,1);
    }

    .wheel::before {
      content: "";
      position: absolute;
      width: 72%;
      height: 32%;
      top: 9%;
      left: 14%;
      border-radius: 50%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.16),
        rgba(255,255,255,0)
      );
      transform: rotate(-20deg);
      pointer-events: none;
    }

    .wheel-center {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 25%,
          #3c3c3c,
          #101010 55%,
          #050505
        );

      border: 3px solid #d5d5d5;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      box-shadow:
        0 0 0 4px #1b1b1b,
        0 0 0 5px #888,
        0 8px 25px rgba(0,0,0,0.7);
    }

    /* BUTTON */

    #spinButton {
      border: 1px solid #f4f4f4;
      border-radius: 4px;

      padding: 16px 58px;

      background:
        linear-gradient(
          180deg,
          #f7f7f7 0%,
          #cfcfcf 48%,
          #8d8d8d 52%,
          #e8e8e8 100%
        );

      color: #111;

      font-family: "DM Mono", monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 4px;

      cursor: pointer;

      box-shadow:
        0 3px 0 #555,
        0 7px 20px rgba(0,0,0,0.5);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    #spinButton:hover {
      transform: translateY(-2px);

      box-shadow:
        0 5px 0 #555,
        0 10px 25px rgba(0,0,0,0.6),
        0 0 18px rgba(108,167,255,0.15);
    }

    #spinButton:active {
      transform: translateY(2px);

      box-shadow:
        0 1px 0 #555,
        0 3px 10px rgba(0,0,0,0.5);
    }

    #spinButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 2px 0 #555;
    }

    /* REMAINING */

    .remaining {
      margin-top: 22px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .remaining::before {
      content: "ARCHIVE // ";
      color: var(--burgundy-bright);
    }

    /* RESULT */

    .result {
      width: min(700px, 100%);
      margin-top: 45px;
      padding: 30px 20px;

      border-top: 1px solid rgba(255,255,255,0.18);
      border-bottom: 1px solid rgba(255,255,255,0.18);

      animation: reveal 0.7s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      color: var(--burgundy-bright);
      font-size: 9px;
      letter-spacing: 4px;
      margin-bottom: 5px;
    }

    #movieTitle {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.05;
      margin: 8px 0;
      color: var(--ivory);
    }

    #movieYear {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 3px;
      margin: 0;
    }

    #movieYear::before {
      content: "— ";
      color: var(--burgundy-bright);
    }

    .hidden {
      display: none;
    }

    /* MESSAGE */

    #message {
      margin-top: 20px;
      color: #e87878;
      font-size: 10px;
      max-width: 600px;
      letter-spacing: 0.5px;
    }

    /* FOOTER */

    .footer {
      margin-top: auto;
      padding-top: 55px;
      color: #555;
      font-size: 8px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .app {
        padding-top: 22px;
      }

      .header {
        padding-bottom: 14px;
      }

      .catalog-number {
        display: none;
      }

      .header {
        justify-content: center;
      }

      .status {
        position: absolute;
        right: 20px;
      }

      h1 {
        margin-top: 32px;
      }

      .wheel-container {
        margin-top: 42px;
      }

      .wheel-center {
        width: 82px;
        height: 82px;
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="catalog-number">
        FILM / 001
      </div>

      <div class="brand">
        MOVIE RING
      </div>

      <div class="status">
        <span class="status-dot"></span>
        READY
      </div>

    </header>

    <h1>Choose a Film.</h1>

    <p class="subtitle">
      Let fate select your next screening.
    </p>

    <div class="wheel-container">

      <div class="pointer">▼</div>

      <div id="wheel" class="wheel">

        <div class="wheel-center">
          🎬
        </div>

      </div>

    </div>

    <button id="spinButton">
      SPIN
    </button>

    <div id="remaining" class="remaining">
      Loading movies...
    </div>

    <div id="result" class="result hidden">

      <div class="result-label">
        NOW PLAYING
      </div>

      <h2 id="movieTitle"></h2>

      <p id="movieYear"></p>

    </div>

    <div id="message"></div>

    <div class="footer">
      SELECTED FROM THE ARCHIVE
    </div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://kjyqhalcyrcklhgkqqtd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ETChgCgyYIhfVkaOY6zrSw_Hx1s2ixW";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const wheel =
      document.getElementById("wheel");

    const spinButton =
      document.getElementById("spinButton");

    const remaining =
      document.getElementById("remaining");

    const result =
      document.getElementById("result");

    const movieTitle =
      document.getElementById("movieTitle");

    const movieYear =
      document.getElementById("movieYear");

    const message =
      document.getElementById("message");

    let movies = [];
    let rotation = 0;

    async function loadMovies() {
      remaining.textContent =
        "Loading movies...";

      const { data, error } =
        await client
          .from("Movies")
          .select("id, title, year")
          .eq("chosen", false);

      if (error) {
        console.error(
          "Supabase error:",
          error
        );

        remaining.textContent = "";

        message.textContent =
          "Supabase error: " +
          error.message;

        spinButton.disabled = true;

        return;
      }

      movies = data || [];

      updateRemaining();
    }

    function updateRemaining() {
      remaining.textContent =
        `${movies.length} movie${movies.length === 1 ? "" : "s"} remaining`;

      spinButton.disabled =
        movies.length === 0;
    }

    spinButton.addEventListener(
      "click",
      async () => {
        if (movies.length === 0) {
          return;
        }

        spinButton.disabled = true;
        message.textContent = "";
        result.classList.add("hidden");

        const randomIndex =
          Math.floor(
            Math.random() * movies.length
          );

        const movie =
          movies[randomIndex];

        rotation +=
          1800 +
          Math.floor(
            Math.random() * 720
          );

        wheel.style.transform =
          `rotate(${rotation}deg)`;

        setTimeout(
          async () => {
            movieTitle.textContent =
              movie.title;

            movieYear.textContent =
              movie.year || "";

            result.classList.remove(
              "hidden"
            );

            const { error } =
              await client
                .from("Movies")
                .update({
                  chosen: true,
                  chosen_at:
                    new Date().toISOString()
                })
                .eq("id", movie.id);

            if (error) {
              console.error(
                "Update error:",
                error
              );

              message.textContent =
                "The movie was selected, but it could not be marked as chosen.";

              spinButton.disabled = false;

              return;
            }

            movies =
              movies.filter(
                m => m.id !== movie.id
              );

            updateRemaining();
          },
          4000
        );
      }
    );

    loadMovies();
  </script>

</body>
</html>
