<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Ring</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #111111;
      --white: #f7f7f3;
      --red: #d62839;

      --sea-1: #a8e6d4;
      --sea-2: #8edbd5;
      --sea-3: #82cfe0;
      --sea-4: #91c9e8;
      --sea-5: #a8c8e8;
      --sea-6: #9dd9dc;
      --sea-7: #8dd8c9;
      --sea-8: #b1e2d3;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--white);
      color: var(--black);

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      padding: 30px 20px 50px;
    }

    /* ---------------- HEADER ---------------- */

    header {
      width: 100%;
      max-width: 1000px;

      border-bottom: 2px solid var(--black);

      padding-bottom: 12px;
    }

    .header-text {
      width: 100%;

      font-size: clamp(8px, 1.55vw, 15px);
      font-weight: 600;

      letter-spacing: -0.15px;

      line-height: 1;

      white-space: nowrap;

      text-align: justify;
      text-align-last: justify;
    }

    /* ---------------- WHEEL ---------------- */

    .wheel-container {
      position: relative;

      width: min(78vw, 470px);
      height: min(78vw, 470px);

      margin: 55px 0 35px;
    }

    /*
      The wheel container is larger than the wheel itself.
      This gives the glitch fragments room to extend
      into the white space.
    */

    .wheel-container::before,
    .wheel-container::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      pointer-events: none;

      z-index: 1;
    }

    /*
      Large fragmented/refracted red layer.
      The repeating conic gradient creates irregular
      pieces around the circumference.
    */

    .wheel-container::before {
      inset: -24px;

      background:
        conic-gradient(
          from 7deg,

          transparent 0deg 8deg,
          rgba(214, 40, 57, 0.55) 8deg 9deg,
          transparent 9deg 18deg,

          rgba(214, 40, 57, 0.18) 18deg 20deg,
          transparent 20deg 31deg,

          rgba(214, 40, 57, 0.40) 31deg 32deg,
          transparent 32deg 46deg,

          rgba(214, 40, 57, 0.12) 46deg 50deg,
          transparent 50deg 63deg,

          rgba(214, 40, 57, 0.48) 63deg 64deg,
          transparent 64deg 79deg,

          rgba(214, 40, 57, 0.20) 79deg 82deg,
          transparent 82deg 96deg,

          rgba(214, 40, 57, 0.55) 96deg 97deg,
          transparent 97deg 111deg,

          rgba(214, 40, 57, 0.14) 111deg 115deg,
          transparent 115deg 129deg,

          rgba(214, 40, 57, 0.42) 129deg 130deg,
          transparent 130deg 145deg,

          rgba(214, 40, 57, 0.20) 145deg 148deg,
          transparent 148deg 164deg,

          rgba(214, 40, 57, 0.50) 164deg 165deg,
          transparent 165deg 181deg,

          rgba(214, 40, 57, 0.16) 181deg 185deg,
          transparent 185deg 201deg,

          rgba(214, 40, 57, 0.44) 201deg 202deg,
          transparent 202deg 217deg,

          rgba(214, 40, 57, 0.20) 217deg 220deg,
          transparent 220deg 236deg,

          rgba(214, 40, 57, 0.55) 236deg 237deg,
          transparent 237deg 253deg,

          rgba(214, 40, 57, 0.15) 253deg 257deg,
          transparent 257deg 272deg,

          rgba(214, 40, 57, 0.48) 272deg 273deg,
          transparent 273deg 289deg,

          rgba(214, 40, 57, 0.20) 289deg 293deg,
          transparent 293deg 309deg,

          rgba(214, 40, 57, 0.55) 309deg 310deg,
          transparent 310deg 327deg,

          rgba(214, 40, 57, 0.16) 327deg 331deg,
          transparent 331deg 344deg,

          rgba(214, 40, 57, 0.42) 344deg 345deg,
          transparent 345deg 360deg
        );

      /*
        Cut out the center so the effect exists
        only around the outer circumference.
      */

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 0 77%,
          black 78% 91%,
          transparent 92%
        );

      mask:
        radial-gradient(
          circle,
          transparent 0 77%,
          black 78% 91%,
          transparent 92%
        );

      transform:
        rotate(-2deg)
        scaleX(1.03);

      filter: blur(0.2px);
    }

    /*
      Secondary refracted layer.
      This is deliberately offset from the first layer
      to create the "glitch" feeling.
    */

    .wheel-container::after {
      inset: -17px;

      background:
        repeating-conic-gradient(
          from 22deg,

          transparent 0deg 5deg,

          rgba(214, 40, 57, 0.22) 5deg 5.7deg,

          transparent 5.7deg 13deg,

          rgba(214, 40, 57, 0.10) 13deg 15deg,

          transparent 15deg 23deg
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 0 78%,
          black 79% 89%,
          transparent 90%
        );

      mask:
        radial-gradient(
          circle,
          transparent 0 78%,
          black 79% 89%,
          transparent 90%
        );

      transform:
        translate(4px, -2px)
        rotate(3deg)
        scaleX(1.02);

      filter: blur(0.5px);
    }

    /* ---------------- EXTRA GLITCH FRAGMENTS ---------------- */

    .glitch {
      position: absolute;

      z-index: 3;

      pointer-events: none;

      background: var(--red);

      opacity: 0.7;

      transform-origin: center;
    }

    /*
      Individual fragments positioned around the wheel.
      Their slightly different sizes and angles make the
      border feel like it is physically breaking apart.
    */

    .glitch-1 {
      width: 24px;
      height: 2px;

      top: 7%;
      right: -8px;

      transform: rotate(18deg);
    }

    .glitch-2 {
      width: 8px;
      height: 2px;

      top: 15%;
      right: -17px;

      opacity: 0.35;

      transform: rotate(-8deg);
    }

    .glitch-3 {
      width: 31px;
      height: 1px;

      top: 29%;
      right: -22px;

      opacity: 0.45;

      transform: rotate(11deg);
    }

    .glitch-4 {
      width: 13px;
      height: 3px;

      top: 44%;
      right: -14px;

      opacity: 0.65;

      transform: rotate(-5deg);
    }

    .glitch-5 {
      width: 28px;
      height: 1px;

      bottom: 27%;
      right: -18px;

      opacity: 0.3;

      transform: rotate(-16deg);
    }

    .glitch-6 {
      width: 18px;
      height: 2px;

      bottom: 12%;
      right: -10px;

      opacity: 0.55;

      transform: rotate(21deg);
    }

    .glitch-7 {
      width: 21px;
      height: 2px;

      bottom: 4%;
      left: 23%;

      opacity: 0.45;

      transform: rotate(-12deg);
    }

    .glitch-8 {
      width: 34px;
      height: 1px;

      bottom: -12px;
      left: 43%;

      opacity: 0.3;

      transform: rotate(5deg);
    }

    .glitch-9 {
      width: 12px;
      height: 3px;

      bottom: 8%;
      left: 12%;

      opacity: 0.65;

      transform: rotate(17deg);
    }

    .glitch-10 {
      width: 27px;
      height: 1px;

      bottom: 24%;
      left: -17px;

      opacity: 0.4;

      transform: rotate(-13deg);
    }

    .glitch-11 {
      width: 9px;
      height: 2px;

      top: 43%;
      left: -15px;

      opacity: 0.7;

      transform: rotate(8deg);
    }

    .glitch-12 {
      width: 30px;
      height: 1px;

      top: 27%;
      left: -20px;

      opacity: 0.35;

      transform: rotate(-17deg);
    }

    .glitch-13 {
      width: 16px;
      height: 3px;

      top: 13%;
      left: -10px;

      opacity: 0.55;

      transform: rotate(12deg);
    }

    .glitch-14 {
      width: 25px;
      height: 1px;

      top: 4%;
      left: 29%;

      opacity: 0.3;

      transform: rotate(-6deg);
    }

    /* ---------------- WHEEL ---------------- */

    .wheel {
      position: relative;

      z-index: 4;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      border: 3px solid var(--red);

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        conic-gradient(
          var(--sea-1),
          var(--sea-2),
          var(--sea-3),
          var(--sea-4),
          var(--sea-5),
          var(--sea-6),
          var(--sea-7),
          var(--sea-8),
          var(--sea-1)
        );

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.16);

      transition:
        transform 4s cubic-bezier(.12, .72, .12, 1);
    }

    .wheel::before {
      content: "";

      position: absolute;

      width: 70%;
      height: 32%;

      top: 7%;
      left: 15%;

      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.5),
          rgba(255, 255, 255, 0)
        );

      transform: rotate(-18deg);

      pointer-events: none;
    }

    .wheel-center {
      position: relative;

      z-index: 2;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      background: var(--black);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;

      border: 4px solid white;

      box-shadow:
        0 0 0 3px var(--black),
        0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* ---------------- POINTER ---------------- */

    .pointer {
      position: absolute;

      z-index: 10;

      top: -24px;
      left: 50%;

      transform: translateX(-50%);

      color: var(--red);

      font-size: 38px;

      line-height: 1;
    }

    /* ---------------- BUTTON ---------------- */

    #spinButton {
      border: 2px solid var(--black);

      background: var(--black);
      color: white;

      padding: 17px 65px;

      border-radius: 0;

      font-family:
        Helvetica,
        Arial,
        sans-serif;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 2px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    #spinButton:hover {
      background: var(--red);

      border-color: var(--red);

      transform: translateY(-2px);
    }

    #spinButton:active {
      transform: translateY(1px);
    }

    #spinButton:disabled {
      opacity: 0.35;

      cursor: not-allowed;

      transform: none;
    }

    /* ---------------- REMAINING ---------------- */

    .remaining {
      margin-top: 20px;

      font-size: 12px;

      font-weight: 600;

      font-style: italic;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #555;
    }

    /* ---------------- RESULT ---------------- */

    .result {
      width: min(800px, 100%);

      margin-top: 55px;

      padding: 30px 20px;

      border-top: 2px solid var(--black);
      border-bottom: 2px solid var(--black);

      animation:
        reveal 0.6s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      margin-bottom: 12px;

      color: var(--red);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    #movieTitle {
      margin: 0;

      font-size: clamp(36px, 7vw, 70px);

      line-height: 0.95;

      font-weight: 700;

      letter-spacing: -3px;
    }

    #movieYear {
      margin: 15px 0 0;

      font-size: 15px;

      color: #555;

      font-weight: 400;
    }

    .hidden {
      display: none;
    }

    /* ---------------- MESSAGE ---------------- */

    #message {
      margin-top: 20px;

      max-width: 600px;

      color: var(--red);

      font-size: 12px;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 600px) {

      .app {
        padding-top: 20px;
      }

      header {
        padding-bottom: 10px;
      }

      .header-text {
        font-size: 7.5px;
        letter-spacing: -0.3px;
      }

      .wheel-container {
        width: 82vw;
        height: 82vw;

        margin-top: 48px;
      }

      .wheel {
        border-width: 3px;
      }

      .wheel-center {
        width: 82px;
        height: 82px;

        font-size: 29px;
      }

      .pointer {
        font-size: 32px;
        top: -21px;
      }

      #spinButton {
        width: min(80vw, 330px);

        padding: 16px 30px;
      }

      .result {
        margin-top: 45px;
      }

      #movieTitle {
        letter-spacing: -2px;
      }

      /*
        Reduce the outer fragments slightly on
        smaller screens so they don't dominate
        the layout.
      */

      .wheel-container::before {
        inset: -17px;
      }

      .wheel-container::after {
        inset: -13px;
      }

      .glitch-1,
      .glitch-3,
      .glitch-5,
      .glitch-8,
      .glitch-10,
      .glitch-12 {
        opacity: 0.25;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>

      <div class="header-text">
        i hate movies more than i hate the second thing on the list of the things i hate
      </div>

    </header>


    <div class="wheel-container">

      <!-- Glitch/refracting fragments -->

      <span class="glitch glitch-1"></span>
      <span class="glitch glitch-2"></span>
      <span class="glitch glitch-3"></span>
      <span class="glitch glitch-4"></span>
      <span class="glitch glitch-5"></span>
      <span class="glitch glitch-6"></span>
      <span class="glitch glitch-7"></span>
      <span class="glitch glitch-8"></span>
      <span class="glitch glitch-9"></span>
      <span class="glitch glitch-10"></span>
      <span class="glitch glitch-11"></span>
      <span class="glitch glitch-12"></span>
      <span class="glitch glitch-13"></span>
      <span class="glitch glitch-14"></span>


      <div class="pointer">
        ▼
      </div>


      <div id="wheel" class="wheel">

        <div class="wheel-center">
          🎬
        </div>

      </div>

    </div>


    <button id="spinButton">
      SPIN
    </button>


    <div id="remaining" class="remaining">
      Loading movies...
    </div>


    <div id="result" class="result hidden">

      <div class="result-label">
        Your Film
      </div>

      <h2 id="movieTitle"></h2>

      <p id="movieYear"></p>

    </div>


    <div id="message"></div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://kjyqhalcyrcklhgkqqtd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ETChgCgyYIhfVkaOY6zrSw_Hx1s2ixW";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const wheel =
      document.getElementById("wheel");

    const spinButton =
      document.getElementById("spinButton");

    const remaining =
      document.getElementById("remaining");

    const result =
      document.getElementById("result");

    const movieTitle =
      document.getElementById("movieTitle");

    const movieYear =
      document.getElementById("movieYear");

    const message =
      document.getElementById("message");


    let movies = [];

    let rotation = 0;


    /* ---------------- WHEEL GENERATOR ---------------- */

    function updateWheel() {

      const count = movies.length;


      if (count === 0) {

        wheel.style.background =
          "var(--sea-1)";

        return;
      }


      const colors = [
        "#a8e6d4",
        "#8edbd5",
        "#82cfe0",
        "#91c9e8",
        "#a8c8e8",
        "#9dd9dc",
        "#8dd8c9",
        "#b1e2d3"
      ];


      const segmentSize =
        360 / count;


      const stops = [];


      for (let i = 0; i < count; i++) {

        const start =
          i * segmentSize;

        const end =
          (i + 1) * segmentSize;


        const color =
          colors[i % colors.length];


        stops.push(
          `${color} ${start}deg ${end}deg`
        );

      }


      wheel.style.background =
        `conic-gradient(${stops.join(",")})`;

    }


    /* ---------------- LOAD MOVIES ---------------- */

    async function loadMovies() {

      remaining.textContent =
        "Loading movies...";


      const { data, error } =
        await client
          .from("Movies")
          .select("id, title, year")
          .eq("chosen", false);


      if (error) {

        console.error(
          "Supabase error:",
          error
        );

        remaining.textContent = "";

        message.textContent =
          "Supabase error: " +
          error.message;

        spinButton.disabled = true;

        return;
      }


      movies = data || [];


      updateWheel();

      updateRemaining();

    }


    /* ---------------- UPDATE COUNTER ---------------- */

    function updateRemaining() {

      remaining.textContent =
        `${movies.length} movie${movies.length === 1 ? "" : "s"} remaining`;

      spinButton.disabled =
        movies.length === 0;

    }


    /* ---------------- SPIN ---------------- */

    spinButton.addEventListener(
      "click",
      async () => {

        if (movies.length === 0) {
          return;
        }


        spinButton.disabled = true;

        message.textContent = "";

        result.classList.add("hidden");


        const randomIndex =
          Math.floor(
            Math.random() * movies.length
          );


        const movie =
          movies[randomIndex];


        rotation +=
          1800 +
          Math.floor(
            Math.random() * 720
          );


        wheel.style.transform =
          `rotate(${rotation}deg)`;


        setTimeout(
          async () => {

            movieTitle.textContent =
              movie.title;


            movieYear.textContent =
              movie.year || "";


            result.classList.remove(
              "hidden"
            );


            const { error } =
              await client
                .from("Movies")
                .update({
                  chosen: true,
                  chosen_at:
                    new Date().toISOString()
                })
                .eq("id", movie.id);


            if (error) {

              console.error(
                "Update error:",
                error
              );


              message.textContent =
                "The movie was selected, but it could not be marked as chosen.";


              spinButton.disabled =
                false;


              return;

            }


            movies =
              movies.filter(
                m => m.id !== movie.id
              );


            updateWheel();

            updateRemaining();

          },
          4000
        );

      }
    );


    /* ---------------- START ---------------- */

    loadMovies();

  </script>

</body>
</html>
