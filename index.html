<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Ring</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #252525 0%, #0b0b0b 55%, #000 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 60px);
      letter-spacing: 4px;
    }

    .subtitle {
      color: #aaa;
      margin: 10px 0 0;
    }

    .wheel-container {
      position: relative;
      width: min(78vw, 440px);
      height: min(78vw, 440px);
      margin: 45px 0 35px;
    }

    .pointer {
      position: absolute;
      z-index: 10;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      color: #e5b93f;
      font-size: 42px;
      filter: drop-shadow(0 3px 4px #000);
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 12px solid #e5b93f;

      background: conic-gradient(
        #e63946 0deg 45deg,
        #1d3557 45deg 90deg,
        #457b9d 90deg 135deg,
        #e9c46a 135deg 180deg,
        #2a9d8f 180deg 225deg,
        #264653 225deg 270deg,
        #f4a261 270deg 315deg,
        #6a4c93 315deg 360deg
      );

      box-shadow:
        0 0 35px rgba(229, 185, 63, 0.3),
        inset 0 0 35px rgba(0, 0, 0, 0.6);

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform 4s cubic-bezier(.12,.72,.12,1);
    }

    .wheel-center {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: #111;
      border: 5px solid #e5b93f;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
    }

    #spinButton {
      border: none;
      border-radius: 50px;

      padding: 18px 60px;

      background: #e5b93f;
      color: #111;

      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(229, 185, 63, 0.25);

      transition:
        transform 0.15s,
        background 0.15s;
    }

    #spinButton:hover {
      transform: scale(1.05);
      background: #ffd95a;
    }

    #spinButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .remaining {
      margin-top: 18px;
      color: #999;
    }

    .result {
      margin-top: 35px;
      max-width: 700px;
      animation: reveal 0.5s ease;
    }

    .result-label {
      color: #e5b93f;
      font-size: 13px;
      letter-spacing: 3px;
    }

    #movieTitle {
      font-size: clamp(28px, 5vw, 42px);
      margin: 10px 0 5px;
    }

    #movieYear {
      color: #aaa;
      font-size: 20px;
      margin: 0;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 20px;
      color: #e66;
      max-width: 600px;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>🎬 MOVIE RING</h1>

    <p class="subtitle">
      Let fate choose your next movie.
    </p>

    <div class="wheel-container">

      <div class="pointer">▼</div>

      <div id="wheel" class="wheel">
        <div class="wheel-center">
          🎬
        </div>
      </div>

    </div>

    <button id="spinButton">
      SPIN
    </button>

    <div id="remaining" class="remaining">
      Loading movies...
    </div>

    <div id="result" class="result hidden">

      <div class="result-label">
        YOUR MOVIE
      </div>

      <h2 id="movieTitle"></h2>

      <p id="movieYear"></p>

    </div>

    <div id="message"></div>

  </main>

  <script>
    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
      "https://kjyqhalcyrcklhgkqqtd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ETChgCgyYIhfVkaOY6zrSw_Hx1s2ixW";

console.log("Supabase library:", window.supabase);

const { createClient } = window.supabase;

    const supabase =
      createClient(SUPABASE_URL, SUPABASE_KEY);


    // =========================
    // PAGE ELEMENTS
    // =========================

    const wheel =
      document.getElementById("wheel");

    const spinButton =
      document.getElementById("spinButton");

    const remaining =
      document.getElementById("remaining");

    const result =
      document.getElementById("result");

    const movieTitle =
      document.getElementById("movieTitle");

    const movieYear =
      document.getElementById("movieYear");

    const message =
      document.getElementById("message");


    let movies = [];
    let rotation = 0;


    // =========================
    // LOAD MOVIES
    // =========================

    async function loadMovies() {

      message.textContent = "";
      remaining.textContent = "Loading movies...";

      const { data, error } = await supabase
        .from("Movies")
        .select("id, title, year")
        .eq("chosen", false);

      if (error) {

        console.error(error);

        remaining.textContent = "";

        message.textContent =
          "Couldn't load the movies. Check your Supabase table and permissions.";

        spinButton.disabled = true;

        return;
      }

      movies = data || [];

      updateRemaining();
    }


    // =========================
    // REMAINING COUNT
    // =========================

    function updateRemaining() {

      remaining.textContent =
        `${movies.length} movie${movies.length === 1 ? "" : "s"} remaining`;

      if (movies.length === 0) {

        spinButton.disabled = true;

        remaining.textContent =
          "No movies remaining.";

      } else {

        spinButton.disabled = false;
      }
    }


    // =========================
    // SPIN
    // =========================

    spinButton.addEventListener("click", async () => {

      if (movies.length === 0) {
        return;
      }

      spinButton.disabled = true;
      message.textContent = "";

      result.classList.add("hidden");


      // Pick a random movie
      const randomIndex =
        Math.floor(Math.random() * movies.length);

      const movie =
        movies[randomIndex];


      // Spin the wheel
      rotation +=
        1800 +
        Math.floor(Math.random() * 720);

      wheel.style.transform =
        `rotate(${rotation}deg)`;


      // Wait for animation
      setTimeout(async () => {

        movieTitle.textContent =
          movie.title;

        movieYear.textContent =
          movie.year ? movie.year : "";

        result.classList.remove("hidden");


        // Mark movie as chosen
        const { error } =
          await supabase
            .from("Movies")
            .update({
              chosen: true,
              chosen_at: new Date().toISOString()
            })
            .eq("id", movie.id);


if (error) {

  console.error("SUPABASE ERROR:", error);

  remaining.textContent = "";

  message.textContent =
    `Supabase error: ${error.message}`;

  spinButton.disabled = true;

  return;
}


        // Remove it from our local list
        movies =
          movies.filter(
            m => m.id !== movie.id
          );

        updateRemaining();

      }, 4000);

    });


    // =========================
    // START
    // =========================

    loadMovies();

  </script>

</body>
</html>
